name: Build Android APK

on:
    push:
        branches: [main, master]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install dependencies & Build Next.js
              env:
                  NEXT_PUBLIC_BASE_URL: ${{ secrets.BASE_URL }}
                  NEXT_PUBLIC_FRONT_BASE_URL: ${{ secrets.FRONT_BASE_URL }}
                  ACCESS_SECRET_KEY: ${{ secrets.ACCESS_SECRET_KEY }}
                  NEXT_PUBLIC_STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY }}
                  NEXT_PUBLIC_FB_PIXEL_ID: ${{ secrets.FB_PIXEL_ID }}
                  FB_PIXEL_ACCESS_TOKEN: ${{ secrets.FB_PIXEL_ACCESS_TOKEN }}

              run: |
                  npm install
                  npm run build

            - name: Sync Capacitor Android
              run: |
                  npx cap sync android

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '21'

            - name: Build APK with Gradle
              run: |
                  cd android
                  chmod +x gradlew
                  ./gradlew assembleDebug

            - name: Upload APK Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: app-debug
                  path: android/app/build/outputs/apk/debug/app-debug.apk
